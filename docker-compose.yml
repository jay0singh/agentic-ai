services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: rag-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is reached by service name,
      # not the host port mapping from .env.
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    container_name: rag-ui
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_BASE: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgvector_data:
    name: pgvector_data
